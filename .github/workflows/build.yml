name: Build

on:
  push:
    branches: [master, devel, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: release
            configure: -DEASYMORSE_DEPLOY_QT=ON
          - name: Windows
            os: windows-2022
            preset: windows-release
          - name: macOS
            os: macos-15
            preset: release
            # Runs on both Intel and Apple Silicon Macs
            configure: '"-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport qtwebsockets qthttpserver
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 5 out/build/${{ matrix.preset }}/easymorse
          rc=$?
          # 124 = still running when killed by timeout, i.e. it started fine
          test $rc -eq 124

      - name: Package
        working-directory: out/build/${{ matrix.preset }}
        run: cpack

      - name: Install and start the packages (Linux)
        if: runner.os == 'Linux'
        working-directory: out/build/${{ matrix.preset }}
        run: |
          sudo apt-get install -y xvfb "./$(ls easymorse_*.deb)"
          # Without the variables of the Qt used to build: only the bundled one counts
          clean_env="env -i PATH=$PATH HOME=$HOME LANG=C.UTF-8 QT_QUICK_BACKEND=software"
          $clean_env xvfb-run -a easymorse --self-test
          mkdir archive
          tar -xzf easymorse-*.tar.gz -C archive
          $clean_env xvfb-run -a archive/*/bin/easymorse --self-test
          sudo apt-get remove -y easymorse
          test ! -e /usr/bin/easymorse

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/make-appimage.sh out/build/${{ matrix.preset }} out/build/${{ matrix.preset }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: easymorse-${{ runner.os }}
          path: |
            out/build/${{ matrix.preset }}/*.tar.gz
            out/build/${{ matrix.preset }}/*.deb
            out/build/${{ matrix.preset }}/*.zip
            out/build/${{ matrix.preset }}/easymorse-*-win64.exe
            out/build/${{ matrix.preset }}/*.dmg
            out/build/${{ matrix.preset }}/*.AppImage
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      CAN_SIGN: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Cache OpenSSL for Android
        uses: actions/cache@v4
        with:
          path: openssl-android
          key: openssl-android-${{ hashFiles('packaging/android/make-openssl.sh') }}

      - name: Build OpenSSL for Android
        run: packaging/android/make-openssl.sh openssl-android arm64-v8a

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtwebsockets
          cache: true

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B out/build/android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DEASYMORSE_ANDROID_OPENSSL_DIR="$PWD/openssl-android" \
            -DQT_ANDROID_SIGN_APK=${{ env.CAN_SIGN == 'true' && 'ON' || 'OFF' }}

      - name: A release needs a signed APK
        if: startsWith(github.ref, 'refs/tags/v') && env.CAN_SIGN != 'true'
        run: |
          echo "::error::the ANDROID_KEYSTORE_* secrets are not set"
          exit 1

      - name: Decode the signing key
        if: env.CAN_SIGN == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: base64 -d <<< "$KEYSTORE_BASE64" > "$RUNNER_TEMP/release.keystore"

      - name: Build the APK
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cmake --build out/build/android --target apk

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: |
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' out/build/android/CMakeCache.txt)
          outputs=out/build/android/src/app/android-build/build/outputs/apk/release
          if [ "$CAN_SIGN" = true ]; then
            cp "$outputs/android-build-release-signed.apk" "out/build/android/easymorse-$version-android-arm64.apk"
          else
            cp "$outputs/android-build-release-unsigned.apk" "out/build/android/easymorse-$version-android-arm64-unsigned.apk"
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: easymorse-android
          path: out/build/android/easymorse-*.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: ios
          arch: ios
          modules: qtwebsockets
          cache: true

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B out/build/ios -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build (no code signing)
        run: |
          cmake --build out/build/ios --config Release -- \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "EasyMorse ${GITHUB_REF_NAME#v}"
