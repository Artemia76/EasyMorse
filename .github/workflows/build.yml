name: Build

on:
  push:
    branches: [master, devel, 'feature/**']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: release
          - name: Windows
            os: windows-2022
            preset: windows-release
          - name: macOS
            os: macos-14
            preset: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build portaudio19-dev libasound2-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config portaudio

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 5 out/build/${{ matrix.preset }}/easymorse
          rc=$?
          # 124 = still running when killed by timeout, i.e. it started fine
          test $rc -eq 124

      - name: Package
        working-directory: out/build/${{ matrix.preset }}
        run: cpack

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: easymorse-${{ runner.os }}
          path: |
            out/build/${{ matrix.preset }}/*.tar.gz
            out/build/${{ matrix.preset }}/*.deb
            out/build/${{ matrix.preset }}/*.zip
            out/build/${{ matrix.preset }}/*.exe
            out/build/${{ matrix.preset }}/*.dmg
          if-no-files-found: error
