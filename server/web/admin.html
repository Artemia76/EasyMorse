<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EasyMorse administration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 data-i18n="title">Administration</h1>
  <p><a href="/" data-i18n="back">Back to the server page</a></p>
</header>
<main>
  <section id="login-section">
    <h2 data-i18n="login">Administrator login</h2>
    <form id="login">
      <label><span data-i18n="callsign">Callsign</span>
        <input name="callsign" required minlength="2" maxlength="16" autocomplete="username"></label>
      <label><span data-i18n="password">Password</span>
        <input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit" data-i18n="enter">Log in</button>
      <p id="login-result" class="error" role="status"></p>
    </form>
  </section>

  <section id="admin-section" hidden>
    <div class="toolbar">
      <h2 data-i18n="accounts">Accounts</h2>
      <span class="hint" id="whoami"></span>
      <button type="button" class="flat" id="logout" data-i18n="logout">Log out</button>
    </div>
    <p class="hint" id="summary"></p>
    <input id="filter" type="search" data-i18n-placeholder="filter" placeholder="Filter by callsign">
    <p id="action-result" role="status"></p>
    <div id="users"></div>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
