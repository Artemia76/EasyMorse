# nginx: the whole domain to easymorse-server, WebSocket included.
# YunoHost: put this file in /etc/nginx/conf.d/<domain>.d/ (kept when YunoHost
# regenerates its configuration), then: nginx -t && systemctl reload nginx.
# Other nginx: put both locations inside the server block of the domain.
# The port must match EASYMORSE_PORT.
#
# YunoHost: its single sign-on (SSOwat) guards every URL of the domain that no
# application declared public, and would send visitors to the login portal.
# EasyMorse has its own accounts: SSOwat is switched off for these two
# locations only (access_by_lua_block below), the portal stays as it is.
# Without YunoHost (no Lua module), remove both access_by_lua_block lines.

# Signaling WebSocket: kept open as long as the application is in a room
location = /api/v1/ws {
    access_by_lua_block { return; }
    proxy_pass http://127.0.0.1:18180;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # The server reads the client address from X-Forwarded-For (--trust-proxy)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# REST API, web page and administration page
location / {
    access_by_lua_block { return; }
    proxy_pass http://127.0.0.1:18180;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}
