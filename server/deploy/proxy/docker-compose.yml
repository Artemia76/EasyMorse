# EasyMorse server behind a reverse proxy that is already there (YunoHost,
# or any nginx doing HTTPS): no Caddy, the proxy keeps ports 80 and 443.
# The image is built elsewhere and loaded (see ../README.md):
#   cp .env.example .env   # set the values
#   docker compose up -d
#
# Host networking: TURN needs many UDP ports; HTTP and WebSocket only
# listen on 127.0.0.1, reachable through the proxy.

services:
  easymorse:
    image: easymorse-server:${EASYMORSE_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${EASYMORSE_DATA:-/var/lib/easymorse}:/data
    command:
      - --listen=127.0.0.1
      - --port=${EASYMORSE_PORT:-18180}
      - --trust-proxy
      - --rooms=${EASYMORSE_ROOMS:-Beginners,QSO}
      - --public-host=${EASYMORSE_DOMAIN}
      - --external-address=${EASYMORSE_PUBLIC_IP}
      - --turn-port=${EASYMORSE_TURN_PORT:-3478}
      - --relay-ports=${EASYMORSE_RELAY_PORTS:-49160-49200}
